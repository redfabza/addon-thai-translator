name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # ใช้สร้าง GitHub Release เมื่อ push tag

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: หาโฟลเดอร์โปรเจกต์ (ที่มี settings.gradle)
        id: locate
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle -not -path '*/node_modules/*' | head -n1)
          if [ -z "$f" ]; then echo "ไม่พบ settings.gradle"; exit 1; fi
          dir=$(dirname "$f")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "โปรเจกต์อยู่ที่: $dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-sdk-terms: true

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: เตรียมไฟล์ APK
        id: apk
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ver=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle || echo "dev")
          out="WDEV1_Addon_Thai_Translator_v${ver}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$out"
          echo "path=${{ steps.locate.outputs.dir }}/dist/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (เฉพาะเมื่อ push tag เช่น v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          
